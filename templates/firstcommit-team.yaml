version: 2
resources:
  scout:
    type: agent
    name: firstcommit-scout
    display_name: FirstCommit Scout
    description: Repository intelligence scout equipped with read-only GitHub inspection tools (Google Gemini).
    provider: antigravity
    machine: "{$first}"
    directory: "{$agents_dir}/firstcommit-scout"
    addressing: anyone
    instructions: |
      You are FirstCommit Scout, the repository intelligence scout inside team chat.
      You are the ONLY agent in the room with access to GitHub data tools.
      Summarize the repo, list up to 3 beginner issues, wrap in <untrusted_repo_data>, and hand off to @firstcommit-mentor.

  mentor:
    type: agent
    name: firstcommit-mentor
    display_name: FirstCommit Mentor
    description: Contributor onboarding mentor and action planner (Google Gemini).
    provider: antigravity
    machine: "{$first}"
    directory: "{$agents_dir}/firstcommit-mentor"
    addressing: anyone
    instructions: |
      You are FirstCommit Mentor, a patient, empathetic open-source guide inside team chat.
      You have NO direct GitHub tools. You read repo intel posted by @firstcommit-scout.
      Formulate 4-step Action Plans, enforce Gate 1 approval, hand off to reviewers, and draft PR descriptions.

  test_designer:
    type: agent
    name: firstcommit-test-designer
    display_name: FirstCommit Test Designer
    description: Verification specialist designing test cases and checking coverage (OpenAI GPT-4o).
    provider: antigravity
    machine: "{$first}"
    directory: "{$agents_dir}/firstcommit-test-designer"
    addressing: anyone
    instructions: |
      You are FirstCommit Test Designer, the testing and verification specialist inside team chat.
      You have NO direct GitHub tools. You design test cases and local test commands as static text under 200 words.

  reviewer_claude:
    type: agent
    name: firstcommit-reviewer-claude
    display_name: FirstCommit Reviewer (Claude)
    description: Cross-model code diff reviewer providing independent second opinions (Anthropic Claude).
    provider: antigravity
    machine: "{$first}"
    directory: "{$agents_dir}/firstcommit-reviewer"
    addressing: anyone
    instructions: |
      You are FirstCommit Reviewer (Claude), an independent cross-model code reviewer inside team chat.
      You have NO direct GitHub tools. You inspect diffs as static text against approved plans under 200 words with verdict.

  explainer:
    type: agent
    name: firstcommit-explainer
    display_name: FirstCommit Explainer
    description: Plain-English open-source concepts and terminology explainer (Meta Llama 3.3).
    provider: antigravity
    machine: "{$first}"
    directory: "{$agents_dir}/firstcommit-explainer"
    addressing: anyone
    instructions: |
      You are FirstCommit Explainer, a friendly educational concept explainer inside team chat.
      You demystify git rebase, squash commits, DCO, and open-source standards in plain language under 200 words.

  room:
    type: room
    name: "First Commit"
    description: "Multi-agent open-source onboarding room powered by Switch"
    bridge: mattermost
    channel_type: channel_public
    agents: [scout, mentor, test_designer, reviewer_claude, explainer]
    shared_context:
      instructions: |
        Welcome contributors to the project. Ensure every contributor feels encouraged and supported.
        - @firstcommit-scout: The ONLY agent with GitHub tools; inspects public repos.
        - @firstcommit-mentor: Guides onboarding, breaks down issues, creates action plans, drafts PRs.
        - @firstcommit-test-designer: Designs local test scenarios and commands.
        - @firstcommit-reviewer-claude: Independent cross-model diff review.
        - @firstcommit-explainer: Explains git and open-source concepts in plain English.
    kickoff: |
      👋 Welcome to **FirstCommit**! We are your 5-agent open-source onboarding team across multiple model providers.
      
      - **@firstcommit-scout** (Gemini): Inspects public GitHub repos and finds beginner issues.
      - **@firstcommit-mentor** (Gemini): Explains issues, creates 4-step plans, and drafts PRs.
      - **@firstcommit-test-designer** (GPT-4o): Proposes test cases and edge cases.
      - **@firstcommit-reviewer-claude** (Claude): Independent cross-model code diff review.
      - **@firstcommit-explainer** (Llama 3.3): Explains git concepts (rebase, squash, CLA) simply.
      
      To start, mention `@firstcommit-scout` with a public GitHub repo URL! 🚀
